name: backend-tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'openapi/**'
      - 'packages/api-client/**'
      - 'Dockerfile'
      - 'Makefile'
      - 'scripts/coverage-gate.sh'
      - '.github/workflows/test.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Generate swagger docs
        run: bash scripts/generate-openapi.sh

      - name: Verify committed OpenAPI contract
        run: git diff --exit-code -- openapi/openapi.yaml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json

      - name: Validate OpenAPI semantics
        run: node scripts/validate-openapi.mjs

      - name: Verify generated TypeScript client
        run: |
          npm --prefix packages/api-client ci
          npm --prefix packages/api-client run generate
          npm --prefix packages/api-client run typecheck
          git diff --exit-code -- packages/api-client/src/generated

      - name: Run unit tests with race detector and coverage
        run: |
          cd backend
          go test -race -count=1 -coverprofile=../coverage.out -coverpkg=./... ./...

      - name: Enforce coverage gate
        run: bash scripts/coverage-gate.sh coverage.out

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Noooste/garage-ui
          files: ./coverage.out
          fail_ci_if_error: false

  smoke:
    name: Smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run smoke test
        run: make test-smoke

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose -p garage-ui-smoke \
            -f backend/tests/smoke/docker-compose.test.yml logs --no-color || true

      - name: Tear down compose
        if: always()
        run: |
          docker compose -p garage-ui-smoke \
            -f backend/tests/smoke/docker-compose.test.yml down -v || true

      conflictPolicy:
        enum:
        - skip
        - overwrite
        type: string
      createdAt:
        type: string
      currentKey:
        type: string
      destinationBucket:
        type: string
      destinationPrefix:
        type: string
      discovered:
        type: integer
      error:
        type: string
      failed:
        type: integer
      finishedAt:
        type: string
      id:
        type: string
      objects:
        items:
          type: string
        type: array
      operation:
        enum:
        - copy
        - move
        - delete
        type: string
      owner:
        type: string
      phase:
        type: string
      prefixes:
        items:
          type: string
        type: array
      processed:
        type: integer
      progress:
        type: number
      skipped:
        type: integer
      sourceBucket:
        type: string
      startedAt:
        type: string
      status:
        enum:

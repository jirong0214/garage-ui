      key:
        type: string
      url:
        type: string
    type: object
  models.PreviewURLResponse:
    properties:
      expires_at:
        type: string
      url:
        type: string
    type: object
  models.SessionUser:
    properties:
      auth_method:
        type: string
      email:
        type: string
      name:
        type: string
      username:
        type: string

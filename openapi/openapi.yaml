securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Health check endpoints
  name: Health
- description: Bucket management operations
  name: Buckets
- description: Object storage and retrieval operations
  name: Objects
- description: Durable recursive and multi-object operations
  name: Object Jobs
- description: User and access key management
  name: Users
- description: Cluster status and node management
  name: Cluster
- description: Monitoring and metrics endpoints
  name: Monitoring

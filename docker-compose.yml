---
services:
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3903"
      - "3903:3903"

  garage-ui-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: garage-ui-api:local
    container_name: garage-ui-api
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./garage.toml:/etc/garage-ui/garage.toml:ro
      - garage-ui-data:/var/lib/garage-ui
    expose:
      - "8080"
    depends_on:
      - garage
    environment:
      # Garage S3 Configuration
      GARAGE_UI_GARAGE_ENDPOINT: "garage:3900"
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: "http://garage:3903"
      GARAGE_UI_GARAGE_TOML: "/etc/garage-ui/garage.toml"
      # Use the Garage admin token as the login credential in this example.
      # Admin username/password login is enabled by default, so disable it
      # explicitly when selecting token authentication instead.
      GARAGE_UI_AUTH_ADMIN_ENABLED: "false"
      GARAGE_UI_AUTH_TOKEN_ENABLED: "true"

  garage-ui-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: garage-ui-web:local
    container_name: garage-ui-web
    restart: unless-stopped
    depends_on:
      garage-ui-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  garage-ui-data:

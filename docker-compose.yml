---
services:
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3903"
      - "3903:3903"

  garage-ui-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: garage-ui-api:local
    container_name: garage-ui-api
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./garage.toml:/etc/garage-ui/garage.toml:ro
      - garage-ui-thumbnail-cache:/var/cache/garage-ui
    expose:
      - "8080"
    depends_on:
      - garage
    environment:
      # Garage S3 Configuration
      GARAGE_UI_GARAGE_ENDPOINT: "garage:3900"
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: "http://garage:3903"
      GARAGE_UI_GARAGE_TOML: "/etc/garage-ui/garage.toml"
      GARAGE_UI_GARAGE_WEB_PROTOCOL: "https"

      # On-demand object thumbnails
      GARAGE_UI_THUMBNAIL_CACHE_DIR: "/var/cache/garage-ui/thumbnails"
      GARAGE_UI_THUMBNAIL_CONCURRENCY: "4"
      GARAGE_UI_THUMBNAIL_MAX_PIXELS: "50000000"

      # Server Configuration
      GARAGE_UI_SERVER_HOST: "0.0.0.0"
      GARAGE_UI_SERVER_PORT: "8080"
      GARAGE_UI_SERVER_ENVIRONMENT: "production"

      # JWT Configuration
      # IMPORTANT: Replace this with your own Ed25519 private key in production!
      # Generate with: openssl genpkey -algorithm ED25519
      GARAGE_UI_AUTH_JWT_PRIVATE_KEY: |
        -----BEGIN PRIVATE KEY-----
        MC4CAQAwBQYDK2VwBCIEIH0ZHqIV7MEyVsxNYc5TA/a0qaBxgq3ntlFS3w1F03MS
        -----END PRIVATE KEY-----

  garage-ui-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: garage-ui-web:local
    container_name: garage-ui-web
    restart: unless-stopped
    depends_on:
      garage-ui-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  garage-ui-thumbnail-cache:
